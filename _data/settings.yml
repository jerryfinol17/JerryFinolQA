  - name: WorkInPilot Team
    image: "/images/workinpilot.webp"
    designation : Co-Founder
    content : WOW best in-depth review yet. We're still digesting the report. I only wish we had promoted our pending upgrades before the review, but we'll be back next time with improvements based on your great feedback. Thanks — we really appreciate it!

  - name: TickerRisk Team
    image: "/images/TR logo.png"
    designation : Founder
    content : Thank you so much for testing my page. You found things that I, as its builder, didn't find, simply, wow, cannot recommend you enough!

