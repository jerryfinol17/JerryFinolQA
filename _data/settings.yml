    image: "/images/BC logo.png"
    designation : Founder
    content : Thank you so much for taking the time to thoroughly test the product and for pointing out these bugs and usability issues. I really appreciate your detailed feedback, and these are all things I plan to fix as soon as possible.

  - name: NoviSense team
    image: "/images/Novisense logo.png"
    designation : Founder
    content : Thank you, I really appreciate all the feedback! I will definitely address all these. It helped with finding the email bug, which was a big one, so I appreciate it.


#-------------------------------
# Blog Section Settings
blog:
  enable: true
  blog_title:  Thoughts on  <em>Quality</em> # You can add an 'em' element to highlight text.
  blog_description: Not every lesson comes from a bug report. Here you'll find ideas, lessons learned from real products, testing philosophies, and reflections on building better software.


#-------------------------------
# Faq (Frequently asked questions) Settings
faq:
  enable: true
  faq_title: Questions? <em>Answers</em>. # You can add an 'em' element to highlight text.
  faq_description: Find solutions to common queries here.

faq_items:
  - title: What kind of products do you test?
    description: I primarily work with SaaS platforms, web applications, internal tools, and startup products.

  - title: Can you provide examples of your work?
    description: Yes, on my website, you can find a portfolio with examples of my projects.

  - title: Do you only look for bugs?
    description: No. I also review usability, UX, accessibility, confusing flows, copy, edge cases, and anything that could impact the user experience.

  - title: Do you provide automated testing?
    description: Yes. I work with Playwright and Selenium on JS/TS or python  when automation adds value to the project.

  - title: What does a report include?
    description: Every report explains  What happened. Why it matters. How it impacts users. Suggested improvements

  - title: Do you work with startups?
    description: Yes. Most of my work focuses on helping startups improve their products before they reach more users.

  - title: How do we get started?
    description: It starts with a conversation. Tell me about your product, the people you're building it for, and the challenges you're facing. From there, we'll determine the best way to approach testing and whether my services are the right fit.

